<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="50%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#1C1816"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C84B31" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E05A3F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F28E2B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C84B31"/>
      <stop offset="100%" stop-color="#E05A3F"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252936" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="20" fill="url(#gridPattern)"/>

  <!-- Radial Glow Accents -->
  <circle cx="1050" cy="90" r="240" fill="url(#glowGrad)" filter="blur(60px)"/>
  <circle cx="150" cy="350" r="180" fill="url(#glowGrad)" filter="blur(70px)" opacity="0.5"/>

  <!-- Border Outline -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="18.5" fill="none" stroke="#2D3342" stroke-width="1.5"/>

  <!-- Top Pill Tag -->
  <g transform="translate(80, 55)">
    <rect width="210" height="32" rx="16" fill="#201C1B" stroke="#C84B31" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="4.5" fill="#E05A3F"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E05A3F" letter-spacing="1.5">CAMPUS PLATFORM</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="150" font-family="'Georgia', 'Times New Roman', serif" font-size="64" font-weight="800" fill="#F8F9FA" letter-spacing="-1">
    CampusFlow
  </text>
  <text x="465" y="150" font-family="'Georgia', serif" font-size="64" font-weight="800" fill="#E05A3F">.</text>

  <!-- Subtitle -->
  <text x="80" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#9CA3AF">
    The modern university event discovery, cryptographic pass wallet &amp; student community platform.
  </text>

  <!-- Feature Tags Row -->
  <g transform="translate(80, 245)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="36" rx="8" fill="#1C202B" stroke="#2E3547" stroke-width="1"/>
      <text x="14" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#E5E7EB">✨ For You Feed</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(172, 0)">
      <rect width="175" height="36" rx="8" fill="#1C202B" stroke="#2E3547" stroke-width="1"/>
      <text x="14" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#E5E7EB">🤝 Teammate Finder</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(359, 0)">
      <rect width="180" height="36" rx="8" fill="#1C202B" stroke="#2E3547" stroke-width="1"/>
      <text x="14" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#E5E7EB">🎫 Digital Pass Wallet</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(551, 0)">
      <rect width="170" height="36" rx="8" fill="#1C202B" stroke="#2E3547" stroke-width="1"/>
      <text x="14" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#E5E7EB">💳 Verified Pay Gateway</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(733, 0)">
      <rect width="160" height="36" rx="8" fill="#1C202B" stroke="#2E3547" stroke-width="1"/>
      <text x="14" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#E5E7EB">📜 CCA Transcripts</text>
    </g>
    <!-- Pill 6 -->
    <g transform="translate(905, 0)">
      <rect width="140" height="36" rx="8" fill="#1C202B" stroke="#2E3547" stroke-width="1"/>
      <text x="14" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#E5E7EB">⚡ Ctrl + K Search</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="320" x2="1120" y2="320" stroke="#242A38" stroke-width="1"/>

  <!-- Footer Stats / Tech Badges -->
  <g transform="translate(80, 355)">
    <text x="0" y="20" font-family="monospace" font-size="13" font-weight="600" fill="#71717A">STACK:</text>
    <text x="65" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#F87171">React 19</text>
    <text x="135" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="400" fill="#4B5563">•</text>
    <text x="150" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#A78BFA">Tailwind CSS v4</text>
    <text x="275" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="400" fill="#4B5563">•</text>
    <text x="290" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#60A5FA">PHP 8.2 REST APIs</text>
    <text x="430" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="400" fill="#4B5563">•</text>
    <text x="445" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#34D399">MySQL 8.0</text>
    <text x="530" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="400" fill="#4B5563">•</text>
    <text x="545" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#FBBF24">Vite 6</text>
  </g>

  <g transform="translate(1000, 355)">
    <circle cx="0" cy="15" r="4.5" fill="#10B981"/>
    <text x="12" y="19" font-family="monospace" font-size="12" font-weight="600" fill="#10B981">v1.0.0 READY</text>
  </g>
</svg>
